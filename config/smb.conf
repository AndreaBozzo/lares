# lares Samba config for pi5 -> /etc/samba/smb.conf
# Host package, deliberately NOT containerised: SMB wants host networking and
# avahi for discovery, and it must survive the compose stack being stopped
# for a the other workload benchmark run.

[global]
   workgroup = WORKGROUP
   server string = pi5 storage
   server role = standalone server

   # Bind to the wired interface only. wlan0 is disabled (Phase 0) and the
   # docker bridges must never serve SMB.
   interfaces = lo eth0
   bind interfaces only = yes

   # No guests. Every connection authenticates as a real Unix user.
   map to guest = never
   security = user

   # SMB3 minimum. SMB1 is off by default on modern Samba; state it anyway
   # so a future distro default cannot quietly re-enable it.
   server min protocol = SMB3
   client min protocol = SMB3
   smb encrypt = desired

   # Windows 11 clients: keep discovery working without NetBIOS/SMB1.
   # `disable netbios` only stops the NetBIOS *name* service (137/138) -- smbd
   # still offers the legacy NBT session service on 139 unless `smb ports`
   # pins it to 445. Verified: without the line below, 139 stays open.
   disable netbios = yes
   smb ports = 445
   dns proxy = no
   multicast dns register = yes

   # USB SSD over a gigabit link: let sendfile and larger buffers do the work.
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

[storage]
   comment = pi5 storage (1 TB)
   path = /srv/lares/files
   browseable = yes
   read only = no
   valid users = ${PI_USER}
   force group = ${PI_USER}

   # Group-writable + setgid dirs, so files stay usable by containers
   # running as ${PI_USER}'s uid/gid.
   create mask = 0664
   force create mode = 0664
   directory mask = 2775
   force directory mode = 2775

   # Service state lives in /srv/lares/appdata, which is OUTSIDE this share's
   # path entirely -- a structural boundary rather than a veto rule that a
   # later edit could silently drop. A stray Windows write cannot reach a
   # running SQLite database from here.
